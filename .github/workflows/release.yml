name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted publishing prerequisites
        shell: bash
        run: |
          node --version
          npm --version
          npm_version="$(npm --version)"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$npm_version"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"

          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match package version $version." >&2
            exit 1
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=$tag"
            if [[ "$version" == *-* ]]; then echo "dist_tag=next"; echo "prerelease=true"; else echo "dist_tag=latest"; echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

      - name: Create release tarball
        id: pack
        shell: bash
        run: |
          mkdir -p .release
          npm pack --pack-destination .release
          tarball="$(find .release -maxdepth 1 -name '*.tgz' -print -quit)"

          if [ -z "$tarball" ]; then
            echo "npm pack did not create a tarball." >&2
            exit 1
          fi

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Check npm version
        id: npm
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published == 'false'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "${{ steps.package.outputs.dist_tag }}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.package.outputs.tag }}"
          tarball="${{ steps.pack.outputs.tarball }}"

          if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; refusing to mutate it." >&2; exit 1; fi
          prerelease=()
          if [ "${{ steps.package.outputs.prerelease }}" = "true" ]; then prerelease+=(--prerelease); fi
          gh release create "$tag" "$tarball" --verify-tag --title "SpecGov $tag" --generate-notes "${prerelease[@]}"

      - name: Move verified major Action tag
        if: steps.package.outputs.prerelease == 'false' && steps.package.outputs.version == '1.0.0'
        shell: bash
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
