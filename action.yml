name: SpecGov
description: Govern AI-assisted development artifacts in Git pull requests.
author: Fernando Paladini
inputs:
  config:
    {
      description: "Path to .specgov.yml",
      required: false,
      default: ".specgov.yml",
    }
  mode:
    { description: "advisory or strict", required: false, default: "advisory" }
  base-ref: { description: "Base Git ref", required: false }
  head-ref: { description: "Head Git ref", required: false }
  changed-files:
    { description: "Newline-delimited changed files", required: false }
  output-format:
    {
      description: "terminal, markdown, or json",
      required: false,
      default: "terminal",
    }
  semantic:
    {
      description: "Run configured semantic auditor",
      required: false,
      default: "false",
    }
  semantic-failure-policy:
    {
      description: "warn or fail; manifest remains source of truth",
      required: false,
      default: "warn",
    }
outputs:
  status: { description: "pass, warn, fail, or error" }
  report-json: { description: "Versioned analysis report JSON" }
  graph-json: { description: "Normalized artifact graph JSON" }
  detected-frameworks: { description: "Comma-delimited adapter IDs" }
  finding-count: { description: "Total findings" }
runs:
  using: node24
  main: dist/action/index.js
