schema: specgov/v1
mode: advisory
frameworks:
  - generic
domains:
  - id: core
    code:
      - src/**
      - tests/**
    artifacts:
      - .specs/features/specgov-v1/**
policies:
  require_complete_chain: true
  require_change_artifact_for_code: true
  require_verification_evidence: false
  stale_after_days: 90
ignore:
  - node_modules/**
  - dist/**
  - .git/**
semantic:
  enabled: false
